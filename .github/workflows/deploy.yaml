name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Название вашей главной ветки (main или master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # Секрет в этой строчке: мы передаем base прямо во время сборки на GitHub!
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Папка, куда Vite собирает проект

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
